services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend & RAG Engine
  # ----------------------------------------------------------------------------
  - type: web
    name: personal-ai-brain-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python -c "from src.config import settings; from fastembed import TextEmbedding; TextEmbedding(model_name=settings.FASTEMBED_MODEL, cache_dir=str(settings.FASTEMBED_CACHE_DIR))"
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BRAIN_ENV
        value: production
      - key: BRAIN_TRUST_PROXY
        value: "true"
      - key: APP_PASSWORD
        sync: false
      - key: AUTH_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BRAIN_GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: FASTEMBED_CACHE_DIR
        value: .fastembed_cache
      - key: BRAIN_SIMILARITY_THRESHOLD
        value: "0.40"
      - key: BRAIN_TOP_K
        value: "8"
      - key: BRAIN_SCORE_DROP_THRESHOLD
        value: "0.15"

  # ----------------------------------------------------------------------------
  # 2. Next.js Web UI (Static Export)
  # ----------------------------------------------------------------------------
  - type: web
    name: personal-ai-brain-ui
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
