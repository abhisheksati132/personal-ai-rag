[package]
name = "personal-ai-brain"
version = "0.1.0"
description = "Personal AI Brain Native Desktop Application"
authors = ["Abhishek Sati"]
edition = "2021"

[lib]
name = "personal_ai_brain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
